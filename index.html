<style>
:root{
  --bg:#f3f4f7; --panel:#fff; --line:#d8dbe1; --text:#1d2330; --muted:#6b7280; --accent:#2f6fed;
  --g:#2e9e4f; --y:#e0a800; --r:#d64545;
  --g-bg:#eaf7ee; --y-bg:#fff7da; --r-bg:#fdecec;
  --field:#fff; --hover:#f0f2f5; --soft:#f7f8fa; --faint:#9aa1ad; --ph:#b0b6c2;
  --empty:#e1e4ea; --empty2:#cfd3da; --accent-soft:#eef3ff; --ring:#c9d8fb; --warn:#9a6a00; --danger-line:#f0c4c4;
  color-scheme:light;
  --cell-w:170px; --img-h:100px; --head-w:235px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161b; --panel:#1c1f26; --line:#363b46; --text:#e6e8ec; --muted:#9aa1ad; --accent:#5b8cff;
  --g:#3fb565; --y:#e6b422; --r:#e5605f;
  --g-bg:#173020; --y-bg:#332b0e; --r-bg:#3a1c1c;
  --field:#242830; --hover:#2c313b; --soft:#191c22; --faint:#6f7683; --ph:#5c6370;
  --empty:#3a3f4a; --empty2:#4c525e; --accent-soft:#1d2a47; --ring:#2f4a87; --warn:#e0b04a; --danger-line:#6b2e2e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --line:#363b46; --text:#e6e8ec; --muted:#9aa1ad; --accent:#5b8cff;
  --g:#3fb565; --y:#e6b422; --r:#e5605f;
  --g-bg:#173020; --y-bg:#332b0e; --r-bg:#3a1c1c;
  --field:#242830; --hover:#2c313b; --soft:#191c22; --faint:#6f7683; --ph:#5c6370;
  --empty:#3a3f4a; --empty2:#4c525e; --accent-soft:#1d2a47; --ring:#2f4a87; --warn:#e0b04a; --danger-line:#6b2e2e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:12px}

/* Toolbar */
#bar,#bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar2{padding:6px 14px}
#bar2 label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
#ptitle{font-weight:650;font-size:17px;border:1px solid transparent;border-radius:6px;padding:4px 8px;min-width:120px;flex:0 1 300px;text-overflow:ellipsis;background:transparent}
#ptitle:hover,#ptitle:focus{border-color:var(--line);background:var(--field);outline:none}
.spacer{flex:1}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{padding:3px 9px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--r);border-color:var(--danger-line)}
.btn.danger:hover{background:var(--r-bg)}
select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--field);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{--c:#888;display:inline-flex;align-items:center;border:2px solid var(--c);border-radius:999px;overflow:hidden;background:var(--field)}
.chip button{border:0;background:transparent;padding:2px 9px 2px 4px;cursor:pointer;font-size:13px}
.chip .vis{color:var(--c);padding:2px 2px 2px 8px;font-size:14px}
.chip.off{opacity:.5}
.chip .vedit{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.editing{background:var(--c)} .chip.editing button{color:#fff}

#banner{--c:#888;padding:8px 14px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border-bottom:3px solid var(--c);display:flex;gap:12px;align-items:center}
#banner[hidden]{display:none}

/* Layout */
main{flex:1;display:flex;min-height:0}
#stage{flex:1;overflow:auto;padding:18px}
#canvas{position:relative;display:inline-block;min-width:100%}
#matrix{display:inline-block;min-width:100%;padding-bottom:40px}
#printhead{display:none}

/* Matrix */
.row{display:flex;align-items:stretch;margin-bottom:12px;position:relative}
.row.mark-top{box-shadow:0 -4px 0 var(--accent)}
.row.mark-bottom{box-shadow:0 4px 0 var(--accent)}
.rowhead{position:sticky;left:0;z-index:5;flex:0 0 var(--head-w);width:var(--head-w);display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px;margin-right:12px;box-shadow:4px 0 10px -6px rgba(0,0,0,.18)}
.handle{cursor:grab;color:var(--faint);padding:4px 3px;user-select:none;font-size:16px}
.rowname{flex:1;min-width:0;border:1px solid transparent;border-radius:4px;padding:4px 5px;font-weight:650;background:transparent}
.rowname-ro{display:none}
.rowname:hover,.rowname:focus{border-color:var(--line);background:var(--field);outline:none}
.icon{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:3px 6px;border-radius:4px}
.icon:hover{color:var(--r);background:var(--r-bg)}
.cells{display:flex;gap:12px;align-items:stretch;border-radius:8px}
.cell{position:relative;z-index:1;scroll-margin-top:72px;scroll-margin-left:250px;flex:0 0 var(--cell-w);width:var(--cell-w);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .08s}
.ctext{display:flex;flex-direction:column;gap:4px;flex:1}
.cell:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.cell .img{height:var(--img-h);display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:5px;overflow:hidden}
.cell img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.ph{color:var(--ph);font-size:11px;line-height:1.35;text-align:center;padding:4px}
/* leere Zellen: nur dezentes Symbol, Hinweistext erst bei Maus/Auswahl/Datei-Ziehen */
.ph{display:flex;flex-direction:column;align-items:center;gap:2px}
.phicon{width:30px;height:30px;opacity:.55;flex:0 0 auto}
.phtxt{display:none}
.phtypes{display:block;font-size:9.5px;opacity:.8;margin-top:2px;letter-spacing:.02em}
/* Ohne Maus nur das Symbol; bei Maus, Auswahl oder Datei-Ziehen ersetzt der Text das Symbol
   (so braucht der Platzhalter nie mehr Platz als vorhanden). Seitenleiste: immer beides. */
.cell:hover .phtxt,.cell.sel .phtxt,.cell.mark-file .phtxt,
.vt td.sk:hover .phtxt,.vt td.sk.active .phtxt,.vt td.sk.mark-file .phtxt,
.vsk:hover .phtxt,.vsk.mark-file .phtxt,.vcard.active .phtxt,#imgdrop .phtxt{display:block}
.cell:hover .phicon,.cell.sel .phicon,.cell.mark-file .phicon,
.vt td.sk:hover .phicon,.vt td.sk.active .phicon,.vt td.sk.mark-file .phicon,
.vsk:hover .phicon,.vsk.mark-file .phicon,.vcard.active .phicon{display:none}
.vsk .ph{flex:1;min-width:140px}
.cell .ph{padding:1px 4px;line-height:1.25}
.imgdrop{font-size:11px!important;color:var(--ph)!important}
.ctitle{font-weight:600;font-size:clamp(11.5px,calc(var(--cell-w)*.078),13px);line-height:1.25;height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ctitle,.cdesc,.vt td,.rowname{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.ctitle i{color:var(--ph);font-weight:400}
.dots{display:flex;gap:4px;height:14px;margin-top:auto}
.cdesc{font-size:12px;line-height:1.3;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;margin-bottom:2px}
.cell.wd .ctitle{height:auto}
.dot{width:14px;height:14px;border-radius:50%;background:var(--empty);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;line-height:1;color:#fff}
.dot.y{color:#1d2330}
.dot svg{width:10px;height:10px;display:block}
.light svg{width:15px;height:15px;display:block;margin:auto}
.dot.g{background:var(--g)} .dot.y{background:var(--y)} .dot.r{background:var(--r)}
.cell.lvl-g{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g);background:var(--g-bg)}
.cell.lvl-y{border-color:var(--y);box-shadow:inset 0 0 0 2px var(--y);background:var(--y-bg)}
.cell.lvl-r{border-color:var(--r);box-shadow:inset 0 0 0 2px var(--r);background:var(--r-bg)}
.cell.sel{outline:3px solid var(--accent);outline-offset:2px}
.cell.picked{outline:4px solid var(--vc);outline-offset:2px}
.cell.dragging{opacity:.35}
.cell.mark-file{outline:3px dashed var(--accent);outline-offset:2px}
.cell.mark-left::before,.cell.mark-right::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--accent);border-radius:2px}
.cell.mark-left::before{left:-8px} .cell.mark-right::before{right:-8px}
.addcell{flex:0 0 46px;border:2px dashed var(--line);border-radius:8px;background:transparent;font-size:22px;color:var(--faint);cursor:pointer}
.addcell:hover,.cells.mark-end .addcell{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#addrow{border:2px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;width:var(--head-w)}
#addrow:hover{border-color:var(--accent);color:var(--accent)}
/* Kopfzeile + Koordinaten */
.row.colhead{position:sticky;top:-18px;z-index:6;margin-bottom:8px;padding-top:4px;background:var(--bg)}
.colhead .cells{align-items:stretch}
.corner{box-sizing:border-box;flex-direction:column;align-items:stretch!important;justify-content:space-between;padding:4px 10px!important;min-height:50px;font-size:11px;font-weight:600;color:var(--muted);
  background:linear-gradient(to top right,transparent calc(50% - .6px),var(--line),transparent calc(50% + .6px)),var(--panel)!important}
.corner .c-sol{align-self:flex-end} .corner .c-fn{align-self:flex-start}
.colletter{flex:0 0 var(--cell-w);width:var(--cell-w);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:15px;background:var(--soft);border:1px solid var(--line);border-radius:6px}
.rnum{font-weight:700;color:var(--accent);min-width:18px;text-align:center;font-size:13px}
.cgrip{color:var(--faint);font-weight:400;margin-right:5px;cursor:grab}
.cell{user-select:none}
.cco{position:absolute;top:4px;left:4px;z-index:2;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--panel);color:var(--muted);border:1px solid var(--line);line-height:1.3;pointer-events:none}
.co{font-size:10.5px;font-weight:700;padding:0 4px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-right:4px;background:var(--panel)}
/* Variantenübersicht: + Spalte */
.vt-wrap{display:flex;align-items:stretch;gap:12px;width:max-content}
.addvarcol{flex:0 0 46px;border:2px dashed var(--line);border-radius:10px;background:transparent;font-size:22px;color:var(--faint);cursor:pointer}
.addvar-empty{border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:18px 28px;font-size:15px;cursor:pointer}
.addvarcol:hover,.addvar-empty:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#lines{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
#lines circle{stroke:var(--panel);stroke-width:2}

/* Variantenübersicht */
#varlist{margin-top:8px}
#varlist h2{font-size:15px;margin:0 0 4px}
#varlist .sub{margin-bottom:10px}
/* Jede Spalte (Teilfunktionen + jede Lösungsvariante) als eigene Karte mit Abstand */
.vt{border-collapse:separate;border-spacing:12px 0;margin-left:-12px;break-inside:avoid}
.vt th,.vt td{background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
.vt thead th{font-size:13px;white-space:nowrap;border-top:5px solid var(--c,var(--line));border-radius:10px 10px 0 0}
.vt tbody tr:last-child>*{border-radius:0 0 10px 10px}
.vt td.lvl-n{background:var(--panel)}
.vt thead th.off{opacity:.5}
.vl-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.vl-head h2{margin:0}
.vt th .vgrip{cursor:grab}
.vt th .vgrip{color:var(--faint);margin-right:6px;font-weight:400}
.vt th.mark-left{box-shadow:inset 4px 0 0 var(--accent)} .vt th.mark-right{box-shadow:inset -4px 0 0 var(--accent)}
.vt th.dragging{opacity:.4}
.vt th.vcorner{border-top:1px solid var(--line);padding:4px 10px;min-width:200px;height:56px;box-sizing:border-box;vertical-align:top;font-size:11px;font-weight:600;color:var(--muted);
  background:linear-gradient(to top right,transparent calc(50% - .6px),var(--line),transparent calc(50% + .6px)),var(--soft)}
.vt th.vcorner span{display:block;white-space:nowrap} .vt th.vcorner .c-sol{text-align:right;margin-bottom:14px}
.vt tbody th{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;background:var(--soft)}
/* alle Lösungsvarianten gleich breit (folgt dem Schieber «Grösse»); lange Texte brechen um */
.vt{--vw:max(200px,calc(var(--cell-w)*1.15))}
.vt td,.vt thead th[data-vh]{width:var(--vw);min-width:var(--vw);max-width:var(--vw);font-size:13px;overflow-wrap:anywhere}
.vt thead th[data-vh]{white-space:normal}
.vt td.pick{cursor:pointer}
.vt td.pick:hover{outline:2px solid var(--accent);outline-offset:-2px}
.rating-off .dots,.rating-off .rate-sec,.rating-off .rt,.rating-off .vt .why{display:none!important}
.vt td.lvl-g{background:var(--g-bg)} .vt td.lvl-y{background:var(--y-bg)} .vt td.lvl-r{background:var(--r-bg)}
.vt td .pk{display:flex;align-items:center;gap:8px}
.vt td .pk img{height:calc(var(--img-h)*.36);width:calc(var(--img-h)*.48);object-fit:contain;border-radius:4px;background:var(--soft);flex:0 0 auto}
.vt td .why{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.vt td.miss{color:var(--warn);font-style:italic}
.vt tr.sep>*{border-top:2px solid var(--line)}
.vt td .score{grid-template-columns:1fr 42px;margin:0}
.vt td.note{white-space:pre-wrap;color:var(--muted)}
.vt td.sk img{height:calc(var(--img-h)*.8);max-width:calc(var(--cell-w)*.95);object-fit:contain;border-radius:4px;background:var(--soft);cursor:zoom-in;margin:2px}
.vt td.sk.active{outline:2px solid var(--accent);outline-offset:-2px}

/* Variantenskizzen */
.vsk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;padding:6px;border:2px dashed var(--line);border-radius:8px;min-height:46px;align-items:center}
.vsk .th{position:relative}
.vsk .th img{height:64px;max-width:120px;object-fit:contain;border-radius:4px;background:var(--soft);cursor:zoom-in;display:block}
.vsk .th .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:11px;line-height:18px;padding:0;cursor:pointer;display:none}
.vsk .th:hover .x{display:block}
.vsk .hint{font-size:11.5px;color:var(--muted);flex:1;min-width:120px}
.vdrop.mark-file{border-color:var(--accent);background:var(--accent-soft)}
.vcard.active{box-shadow:0 0 0 2px var(--accent)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:6px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}

/* Sidebar */
#side{width:360px;flex:0 0 360px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 40px}
#side h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
#side label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
#side input[type=text],#side textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--field);color:var(--text);font-size:14px;margin-top:2px}
#side input[type=text]:focus,#side textarea:focus{outline:2px solid var(--ring);border-color:var(--accent)}
textarea{resize:vertical;min-height:40px}
.sidetop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.imgdrop{height:190px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--soft);color:var(--muted);text-align:center;padding:6px;font-size:12px}
.imgdrop img{max-width:100%;max-height:100%}
.imgdrop.mark-file{border-color:var(--accent);background:var(--accent-soft)}
.btnrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.rating{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.lights{display:flex;gap:6px}
.light{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;opacity:.25;padding:0;color:#fff;font-weight:800;font-size:13px;line-height:1}
.light.y{color:#1d2330}
.light.g{background:var(--g)} .light.y{background:var(--y)} .light.r{background:var(--r)}
.light.on{opacity:1;border-color:var(--text)}
.light.none{background:var(--field);border-color:var(--line);opacity:1;color:var(--muted);font-size:13px;line-height:1}
.light.none.on{border-color:var(--text)}
.vpick{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.vcard{--c:#888;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:8px;margin-bottom:10px}
.vtop{display:flex;gap:6px;align-items:center}
.vtop input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer;flex:0 0 30px}
.vtop input[type=text]{margin-top:0!important;font-weight:600}
.score{display:grid;grid-template-columns:90px 1fr 42px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.score span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--empty)}
.bar i{display:block;height:100%}
.bar i.g{background:var(--g)} .bar i.y{background:var(--y)} .bar i.r{background:var(--r)} .bar i.n{background:var(--empty2)}
.pts{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.warn{font-size:12px;color:var(--warn);margin:4px 0}
.warn.red{color:var(--r)}
.crit{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.crit input[type=text]{margin-top:0!important}
.eye{border:1px solid var(--line);background:var(--field);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--ph);flex:0 0 30px}
.eye.on{color:var(--accent);border-color:var(--accent)}
.help{padding-left:18px;margin:0;color:var(--muted);font-size:12.5px}
.help li{margin-bottom:4px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--soft)}

body.noside #side{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.seg .ch{width:14px;height:14px;display:block}
#bar2 input[type=range]{width:72px}
#addVar{border-style:dashed;color:var(--muted);font-size:16px;line-height:1;padding:3px 10px}
#addVar:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* Eigene Aufklapp-Menüs (statt <select>, das je nach Browser/Darkmode unsauber aussieht) */
@media (min-width:1200px){ #bar{flex-wrap:nowrap} #bar>*{flex-shrink:0} #bar>#ptitle{flex-shrink:1} }
#themeSeg svg{width:16px;height:16px;display:block}
#themeSeg button{padding:5px 8px}
#saveState{color:var(--accent);font-size:14px;cursor:help;margin-left:-4px}
#bSave.dirty{border-color:var(--accent);color:var(--accent);font-weight:600}
.menu{position:relative;display:inline-block}
.menu>.btn::after{content:" ▾";font-size:11px;color:var(--muted)}
#bar2 .menu>.btn,#bar2 .btn.tgl{padding:3px 9px;font-size:13px}
/* Kippschalter: Schiene + Knopf, gleitet beim Umschalten nach rechts */
.btn.tgl,#bar2 .btn.tgl{position:relative;padding-left:40px}
.btn.tgl::before{content:"";position:absolute;left:8px;top:50%;width:26px;height:14px;margin-top:-7px;border-radius:7px;background:var(--empty2);transition:background .2s}
.btn.tgl::after{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .2s}
.btn.tgl[aria-pressed=true]::before{background:var(--accent)}
.btn.tgl[aria-pressed=true]::after{transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){ .btn.tgl::before,.btn.tgl::after{transition:none} }
html:not(.ready) .btn.tgl::before,html:not(.ready) .btn.tgl::after{transition:none} /* beim Laden nicht von «aus» nach «ein» gleiten */
#bRate+.menu{margin-left:-4px}
.menu-list{position:absolute;top:calc(100% + 4px);left:0;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:4px;z-index:40}
.menu-list[hidden]{display:none}
.menu-list.right{left:auto;right:0}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:7px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:14px}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--hover);outline:none}
.menu-list button.chk{padding-left:28px;position:relative}
.menu-list .tick{position:absolute;left:9px;color:var(--accent);font-weight:700}
#viewBtn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-list button small{display:block;font-size:11.5px;color:var(--muted)}
#helpDlg,#mobileDlg{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:660px;width:calc(100% - 32px);padding:20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#helpDlg::backdrop,#mobileDlg::backdrop{background:rgba(0,0,0,.45)}
#helpDlg h2,#mobileDlg h2{margin:0;font-size:19px}
#helpDlg .dlg-head,#mobileDlg .dlg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#helpDlg .intro,#mobileDlg .intro{color:var(--muted);margin:0 0 12px}
#helpDlg .help{font-size:14px;color:var(--text);padding-left:20px}
#helpDlg .help li{margin-bottom:7px}
#bHelp{font-weight:600}
#bar2>.g{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
#bar2>.g+.g{border-left:1px solid var(--line);padding-left:12px;margin-left:4px}
#bar2>.g.gvar{flex-wrap:wrap}
#viewBtn .pre{color:var(--muted);font-weight:400}
.grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}

/* Handy: nur ansehen – eine Kopfzeile, keine Bearbeitungs-Elemente, Kasten seitwärts wischen */
@media (max-width:760px){
  #bar{flex-wrap:nowrap;padding:6px 10px;gap:6px}
  #bar>*:not(#ptitle):not(#bOpen):not(#langSeg):not(#bHelp){display:none!important}
  #ptitle{flex:1 1 auto;min-width:0;font-size:15px;pointer-events:none}
  #bar2,#side,.addcell,#addrow,.handle,.delrow,.cgrip,.vgrip,.addvarcol,.addvar-empty,#varSortMenu{display:none!important}
  #stage{padding:10px}
  /* Teilfunktionen: Titel hochkant in schmaler Spalte, nicht festgehalten (wie in der Übersicht) */
  :root{--head-w:40px}
  .rowhead,.row.colhead{position:static;box-shadow:none}
  .rowhead{flex-direction:column;justify-content:center;gap:4px;padding:6px 2px;margin-right:8px}
  .row.colhead .rowhead.corner{visibility:hidden;min-height:0;height:30px;padding:0!important}
  .cells{gap:8px} .row{margin-bottom:8px}
  .cell .cdesc{display:none}
  .vt{--vw:150px;border-spacing:8px 0;margin-left:-8px}
  .vt th,.vt td{padding:5px 7px}
  .vt th.vcorner{min-width:0;width:96px}
  .vt th.vcorner span{white-space:normal}
  .vt tbody th{white-space:normal;font-size:11.5px;width:96px;hyphens:auto;-webkit-hyphens:auto}
  .vt td,.vt thead th[data-vh]{font-size:12px}
  #matrix .rowname{display:none}
  .rowname-ro{display:block!important;writing-mode:vertical-rl;transform:rotate(180deg);max-height:100%;overflow:hidden;font-weight:650;font-size:12.5px;line-height:1.2;white-space:nowrap;text-overflow:ellipsis}
  .seg button{white-space:nowrap}
  #bOpen,#langSeg,#bHelp{flex-shrink:0}
  #bar .btn,#bar .seg button{padding:5px 8px}
  #mobileDlg .btnrow{flex-direction:column;align-items:stretch}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
  --bg:#f3f4f7; --panel:#fff; --line:#d8dbe1; --text:#1d2330; --muted:#6b7280; --accent:#2f6fed;
  --g:#2e9e4f; --y:#e0a800; --r:#d64545;
  --g-bg:#eaf7ee; --y-bg:#fff7da; --r-bg:#fdecec;
  --field:#fff; --hover:#f0f2f5; --soft:#f7f8fa; --faint:#9aa1ad; --ph:#b0b6c2;
  --empty:#e1e4ea; --empty2:#cfd3da; --accent-soft:#eef3ff; --ring:#c9d8fb; --warn:#9a6a00; --danger-line:#f0c4c4;
  color-scheme:light;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  #bar,#bar2,#banner,#side,#toast,#lightbox,#helpDlg,#mobileDlg,.addcell,#addrow,.handle,.delrow,.sk .hint,.ph,#varlist .sub{display:none!important}
  #canvas,#matrix{display:block;min-width:0} /* inline-block lässt sich nicht auf Seiten umbrechen */
  #matrix{padding-bottom:0}
  .row{break-inside:avoid}
  #varlist{break-before:page;margin-top:0}
  #varlist h2{font-size:16px;margin-bottom:8px}
  .vt td.pick:hover{outline:none}
  .rowname{border-color:transparent!important;background:transparent!important}
  main{display:block}
  #stage{overflow:visible;padding:0}
  .rowhead{position:static;box-shadow:none}
  .row.colhead{position:static}
  .addvarcol,.addvar-empty,#varlist.empty,#varSortMenu,.vgrip,.cgrip{display:none!important}
  .cell.sel{outline:none}
  .cell:hover{transform:none;box-shadow:none}
  #printhead{display:block;margin-bottom:10px}
  #printhead h1{font-size:18px;margin:0 0 6px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;align-items:center}
  .legend i{display:inline-block;width:24px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
}

   SCHEMA_VERSION erhöhen, sobald sich der Aufbau der gespeicherten Datei ändert,

   Jeder Schritt bekommt die komplette Datei {format,version,project,images} und gibt sie zurück. */
const SCHEMA_VERSION=1;
const MIGRATIONS={};
function migrate(d){
  const from=Number.isInteger(d.version)?d.version:1;
  if(from>SCHEMA_VERSION) return {newer:from};

function applyStatic(){
  document.documentElement.lang=LANG==='de'?'de-CH':'en';
  // Suchmaschinen: Sprachversion per ?lang= verweist auf sich selbst (sonst gilt sie als Kopie der Hauptadresse)
  const ul=new URLSearchParams(location.search).get('lang'), base='https://master-d1990.github.io/morphological-box/';
  if(ul==='de'||ul==='en'){ $('#canon').href=base+'?lang='+ul; $('#ogurl').content=base+'?lang='+ul; }
  $$('[data-i18n]').forEach(el=>{ el.innerHTML=t(el.dataset.i18n); });
  $$('[data-i18n-title]').forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  $$('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
}
function setLang(l){
  LANG=l; try{ localStorage.setItem('mk-lang',l); }catch(e){}
  applyStatic(); renderTheme(); if(P) renderAll();
}

let P=null;            // Projekt (ohne Bilddaten)
let IMG={};            // Bild-ID -> dataURL
let BLOB={};           // Bild-ID -> blob:URL (Anzeige-Cache)
const PAGE_TITLE=document.title;
const ui={sample:false,sel:null,editVar:null,view:null,handle:null,dirty:false,autosaveOk:true,pasteVar:null,pickVar:null};
let undoStack=[],redoStack=[],editSnap=null;

/* ---------- Modell ---------- */
const newCell=(title='')=>({id:uid(),title,desc:'',img:null,ratings:{}});
const getVar=id=>P.variants.find(v=>v.id===id);
const ALL='*', OFF='-'; // Ampel-Ansicht «Alle Kriterien» bzw. «Aus» (Ideenphase) statt eines einzelnen Kriteriums
const critName=id=>id===ALL?t('overallView'):id===OFF?t('offView'):(P.criteria.find(k=>k.id===id)||{}).name||'';
function viewLvl(c,crit=ui.view){ // Ampelfarbe einer Teillösung in der Ansicht; «Alle Kriterien»: die schlechteste zählt (Rot = K.O.)
  if(crit===OFF) return 'n';
  if(crit!==ALL) return (c.ratings[crit]||{}).level||'n';
  return P.criteria.map(k=>(c.ratings[k.id]||{}).level).filter(Boolean).reduce((w,l)=>w==='n'||RANK[l]>RANK[w]?l:w,'n');
}
function findCell(id){
  for(const row of P.rows){const i=row.cells.findIndex(c=>c.id===id); if(i>=0) return {row,cell:row.cells[i],i};}
  return null;
}
function setRating(cell,crit,lvl){const r=cell.ratings[crit]||(cell.ratings[crit]={level:'',reason:''}); r.level=lvl;}
function ensureRating(cell,crit){return cell.ratings[crit]||(cell.ratings[crit]={level:'',reason:''});}
function removeCell(id){
  const f=findCell(id); if(!f) return;
  f.row.cells.splice(f.i,1);
  P.variants.forEach(v=>{if(v.picks[f.row.id]===id) delete v.picks[f.row.id];});
}

function emptyProject(){

/* ---------- Bilder ---------- */
function dataURLtoBlob(u){
  const [h,b]=u.split(','); const mime=(h.match(/:(.*?);/)||[,'image/png'])[1];
  const bin=atob(b); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}
function imgSrc(id){
  if(!id||!IMG[id]) return null;
  if(!BLOB[id]) BLOB[id]=URL.createObjectURL(dataURLtoBlob(IMG[id]));
  return BLOB[id];
}
function clearBlobs(){ Object.values(BLOB).forEach(u=>URL.revokeObjectURL(u)); BLOB={}; }
function compressImage(file,max=1000,quality=0.85){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      let w=im.naturalWidth||800,h=im.naturalHeight||600;
      const s=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.drawImage(im,0,0,w,h);
      let out=cv.toDataURL('image/webp',quality);
      if(!out.startsWith('data:image/webp')){
        ctx.globalCompositeOperation='destination-over'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        out=cv.toDataURL('image/jpeg',quality);
      }
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image not readable'));};
    im.src=url;
  });
}
async function setCellImage(cellId,file){

function drawLines(){
  const m=$('#canvas'), svg=$('#lines'); if(!svg||!P) return;
  svg.setAttribute('width',m.offsetWidth); svg.setAttribute('height',m.offsetHeight);
  const base=m.getBoundingClientRect();
  const vis=P.variants.filter(v=>v.visible);
  // Teilen sich mehrere Lösungsvarianten eine Teillösung, werden ihre Punkte gleichmässig über die Bildbreite verteilt
  const lf=(parseFloat(document.documentElement.style.getPropertyValue('--cell-w'))||170)/170; // Linien, Punkte und Pfeil wachsen mit der Zellgrösse (Standard 170 px → 7 px Linie)
  const share={}; vis.forEach(v=>Object.values(v.picks).forEach(cid=>(share[cid]=share[cid]||[]).push(v.id)));
  let out='';
  vis.forEach(v=>{
    const pts=[]; let rad=9*lf;
    for(const row of P.rows){
      const cid=v.picks[row.id]; if(!cid) continue;
      const el=m.querySelector(`.cell[data-cell="${cid}"]`); if(!el) continue;
      const r=(el.querySelector('.img')||el).getBoundingClientRect(); // Bildbereich: unabhängig von Textlänge
      const list=share[cid]||[v.id], k=list.indexOf(v.id), n=list.length, gap=r.width/(n+1);
      rad=Math.min(rad,Math.max(4*lf,gap/2-2));
      pts.push([r.left-base.left+gap*(k+1), r.top-base.top+r.height/2]);
    }
    if(!pts.length) return;
    const lop=P.settings.lineOp??0.55, active=ui.editVar===v.id, op=ui.editVar?(active?Math.max(lop,0.85):lop*0.3):lop;
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let j=1;j<pts.length;j++){
      const [x0,y0]=pts[j-1],[x1,y1]=pts[j],ym=(y0+y1)/2;
      d+=` C${x0.toFixed(1)} ${ym.toFixed(1)} ${x1.toFixed(1)} ${ym.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    }
    // Verlängerung nach unten bis zur Spalte der Variante in der Übersicht
    let arrow='';
    const th=m.querySelector(`#varlist th[data-vh="${v.id}"]`);
    if(th&&!ui.printing){
      const r=th.getBoundingClientRect(), [x0,y0]=pts[pts.length-1];
      const x1=r.left-base.left+r.width/2, y1=r.top-base.top-2, ym=(y0+y1)/2;
      if(y1>y0){
        d+=` C${x0.toFixed(1)} ${ym.toFixed(1)} ${x1.toFixed(1)} ${ym.toFixed(1)} ${x1.toFixed(1)} ${(y1-10).toFixed(1)}`;
        const a=9*lf; arrow=`<path d="M${(x1-a).toFixed(1)} ${(y1-a-3).toFixed(1)} L${(x1+a).toFixed(1)} ${(y1-a-3).toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${v.color}"/>`;
      }
    }
    out+=`<g opacity="${op}"><path d="${d}" fill="none" stroke="${v.color}" stroke-width="${(7*lf).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>`+
      pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rad.toFixed(1)}" fill="${v.color}"/>`).join('')+arrow+`</g>`;
  });
  svg.innerHTML=out;
}
function scoreVariant(v){
  const picked=P.rows.map(row=>row.cells.find(c=>c.id===v.picks[row.id])).filter(Boolean);
  const per=P.criteria.map(k=>{
    const cnt={g:0,y:0,r:0,n:0};
    picked.forEach(c=>{cnt[(c.ratings[k.id]||{}).level||'n']++;});
    const rated=cnt.g+cnt.y+cnt.r;
    return {k,cnt,pct:rated?Math.round((cnt.g*2+cnt.y)/(rated*2)*100):null};
  });
  const missing=P.rows.filter(r=>!r.cells.some(c=>c.id===v.picks[r.id]));
  const red=per.some(p=>p.cnt.r>0);
  return {per,missing,red};
}

function sortCells(mode){
  const byRating=(a,b)=>(RANK[viewLvl(a)]??3)-(RANK[viewLvl(b)]??3);
  const byScore=(a,b)=>cellScore(b)-cellScore(a);
  const cmp={rating:(a,b)=>byRating(a,b)||byScore(a,b), score:(a,b)=>byScore(a,b)||byRating(a,b),
    alpha:(a,b)=>(a.title||'').localeCompare(b.title||'',t('dateLocale'),{numeric:true,sensitivity:'base'})}[mode];
  // Nach Lösungsvarianten: Rang = Position der ersten Lösungsvariante (Übersicht), die die Teillösung wählt; der Rest behält seine Reihenfolge
  const byVar=r=>{ const rk=c=>{ const i=P.variants.findIndex(v=>v.picks[r.id]===c.id); return i<0?P.variants.length:i; }; return (a,b)=>rk(a)-rk(b); };
  if(mode==='variants') change(()=>P.rows.forEach(r=>r.cells.sort(byVar(r))));
  else if(cmp) change(()=>P.rows.forEach(r=>r.cells.sort(cmp)));

function moveVariant(id,targetId,after){

  change(()=>{
    const i=P.variants.findIndex(v=>v.id===id); const [v]=P.variants.splice(i,1);
    let j=P.variants.findIndex(x=>x.id===targetId); if(after) j++;

  });

function moveCell(cellId,rowId,targetId,after){
  const src=findCell(cellId), tRow=P.rows.find(r=>r.id===rowId);
  if(!src||!tRow||targetId===cellId) return;
  change(()=>{
    src.row.cells.splice(src.i,1);
    let idx=tRow.cells.length;
    if(targetId){ idx=tRow.cells.findIndex(c=>c.id===targetId); if(idx<0) idx=tRow.cells.length; else if(after) idx++; }
    tRow.cells.splice(idx,0,src.cell);
    if(src.row!==tRow) P.variants.forEach(v=>{if(v.picks[src.row.id]===cellId) delete v.picks[src.row.id];});
  });
}
function moveRow(rowId,targetId,after){
  if(rowId===targetId) return;
  change(()=>{
    const i=P.rows.findIndex(r=>r.id===rowId); const [row]=P.rows.splice(i,1);
    let j=P.rows.findIndex(r=>r.id===targetId); if(after) j++;
    P.rows.splice(j,0,row);
  });

function moveSel(key){
  const f=findCell(ui.sel); if(!f) return;
  let ri=P.rows.indexOf(f.row), ci=f.i;
  if(key==='ArrowLeft') ci=Math.max(0,ci-1);
  else if(key==='ArrowRight') ci=Math.min(f.row.cells.length-1,ci+1);
  else{
    const d=key==='ArrowUp'?-1:1;
    for(let r=ri+d;r>=0&&r<P.rows.length;r+=d){ if(P.rows[r].cells.length){ ri=r; ci=Math.min(ci,P.rows[r].cells.length-1); break; } }
  }
  select(P.rows[ri].cells[ci].id);
}

/* ---------- Export: Excel (.xlsx, eigener Writer ohne Bibliothek) und CSV ---------- */
const CRC_T=(()=>{ const tb=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; tb[n]=c>>>0; } return tb; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files,type){ // ZIP ohne Kompression (reicht für .xlsx; Bilder sind ohnehin JPEG)
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,time,true); h.setUint16(12,date,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,time,true); c.setUint16(14,date,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((s,p)=>s+p.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type});
}
const xe=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colName(c){ let s=''; c++; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
const NS_MAIN='http://schemas.openxmlformats.org/spreadsheetml/2006/main', NS_REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships', NS_PKG='http://schemas.openxmlformats.org/package/2006/relationships';
const XML_HEAD='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

function makeStyles(){ // sammelt Schriften/Füllungen/Rahmen und vergibt Stil-Indizes
  const fonts=[], fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'], borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'];
  const xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
  const idx=(arr,x)=>{ let i=arr.indexOf(x); if(i<0){ arr.push(x); i=arr.length-1; } return i; };
  const font=({b,i,sz=11,color='FF1D2330'}={})=>idx(fonts,`<font>${b?'<b/>':''}${i?'<i/>':''}<sz val="${sz}"/><color rgb="${color}"/><name val="Calibri"/><family val="2"/></font>`);
  font();
  const fill=c=>c?idx(fills,`<fill><patternFill patternType="solid"><fgColor rgb="${c}"/><bgColor indexed="64"/></patternFill></fill>`):0;
  const border=sides=>{ if(!sides) return 0; const s=k=>sides.includes(k)?`<${k} style="thin"><color rgb="FFC9CDD4"/></${k}>`:`<${k}/>`; return idx(borders,`<border>${s('left')}${s('right')}${s('top')}${s('bottom')}<diagonal/></border>`); };
  const style=(o={})=>{
    const sides=o.border==='all'?['left','right','top','bottom']:o.border?o.border.split(','):null;
    return idx(xfs,`<xf numFmtId="${o.pct?9:0}" fontId="${font(o)}" fillId="${fill(o.fill)}" borderId="${border(sides)}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"${o.pct?' applyNumberFormat="1"':''}><alignment horizontal="${o.h||'left'}" vertical="${o.v||'top'}"${o.wrap===false?'':' wrapText="1"'}/></xf>`);
  };
  const xml=()=>XML_HEAD+`<styleSheet xmlns="${NS_MAIN}"><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return {style,xml};
}
class XSheet{

function cellXml(ref,{v,s}){

  if(typeof v==='number') return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  const body=typeof v==='string'?`<t xml:space="preserve">${xe(v)}</t>`:
    v.rich.filter(r=>r.t).map(r=>`<r><rPr>${r.b?'<b/>':''}${r.i?'<i/>':''}<sz val="${r.sz||11}"/><color rgb="${r.color||'FF1D2330'}"/><rFont val="Calibri"/><family val="2"/></rPr><t xml:space="preserve">${xe(r.t)}</t></r>`).join('');
  return body?`<c r="${ref}" s="${s}" t="inlineStr"><is>${body}</is></c>`:`<c r="${ref}" s="${s}"/>`;
}
function sheetXml(sh,drawRid){

  const rows=[...sh.rows.entries()].sort((a,b)=>a[0]-b[0]).map(([r,row])=>
    `<row r="${r+1}"${row.ht?` ht="${row.ht}" customHeight="1"`:''}>`+[...row.cells.entries()].sort((a,b)=>a[0]-b[0]).map(([c,cell])=>cellXml(colName(c)+(r+1),cell)).join('')+'</row>').join('');
  const f=sh.freeze, pane=f?`<pane${f.c?` xSplit="${f.c}"`:''}${f.r?` ySplit="${f.r}"`:''} topLeftCell="${colName(f.c||0)}${(f.r||0)+1}" activePane="${f.r&&f.c?'bottomRight':f.r?'bottomLeft':'topRight'}" state="frozen"/>`:'';

function drawingXml(pics,rid){
  const E=9525; // EMU pro px
  return XML_HEAD+`<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${NS_REL}">`+

      return `<xdr:oneCellAnchor><xdr:from><xdr:col>${p.c}</xdr:col><xdr:colOff>${Math.round(p.x*E)}</xdr:colOff><xdr:row>${p.r}</xdr:row><xdr:rowOff>${Math.round(p.y*E)}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/>`+
        `<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${i+2}" name="Picture ${i+1}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="${rid[p.img.key]}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>`+
        `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`; }).join('')+'</xdr:wsDr>';

async function xlsxImage(id,cache){ // Excel kennt kein WebP -> JPEG
  if(cache.has(id)) return cache.get(id);
  const src=IMG[id]; if(!src){ cache.set(id,null); return null; }
  try{
    const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
    const cv=document.createElement('canvas'); cv.width=im.naturalWidth||1; cv.height=im.naturalHeight||1;
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(im,0,0);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    const o={key:id,data:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height,file:`image${cache.size+1}.jpeg`};
    cache.set(id,o); return o;
  }catch(e){ console.warn(e); cache.set(id,null); return null; }
}
const fitBox=(im,bw,bh)=>{ const s=Math.min(bw/im.w,bh/im.h); const w=im.w*s, h=im.h*s; return {w,h,x:(bw-w)/2,y:(bh-h)/2}; };

function buildCsv(){
  const sep=LANG==='de'?';':',', cq=v=>{ const s=String(v??''); return /[";,\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const head=[t('xlColPos'),t('xlColSubfn'),t('xlColSolution'),t('desc'),...P.criteria.flatMap(k=>[`${k.name} – ${t('xlColLevel')}`,`${k.name} – ${t('xlColReason')}`]),t('xlColOverall'),t('xlColVariants')];
  const lines=[head.map(cq).join(sep)];
  for(const row of P.rows) for(const c of row.cells){
    const sc=cellScore(c);
    lines.push([coordOf(c,row),row.name,c.title,c.desc,...P.criteria.flatMap(k=>{ const rt=c.ratings[k.id]||{}; return [rt.level?LV(rt.level):'',rt.reason||'']; }),
      sc<0?'':Math.round(sc*100)+' %',P.variants.filter(v=>v.picks[row.id]===c.id).map(v=>v.name).join(', ')].map(cq).join(sep));
  }
  return new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
}
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function exportAs(kind){
  const base=fileName().replace(/\.kasten\.json$/,'');
  if(kind==='pdf'){ $('#stage').scrollLeft=0; window.print(); return; }
  try{
    if(kind==='xlsx'){ toast(t('exporting')); download(await buildXlsx(),base+'.xlsx'); toast(t('exported',base+'.xlsx')); }
    if(kind==='csv'){ download(buildCsv(),base+'.csv'); toast(t('exported',base+'.csv')); }
  }catch(err){ console.error(err); toast(t('exportFail')); }
}

/* Aufklapp-Menüs: Einträge werden beim Öffnen in der aktuellen Sprache erzeugt */
const tr=list=>list.map(([k,label,hint])=>({k,label:t(label),hint:hint?t(hint):''}));
const MENUS={
  viewMenu:{items:()=>[...P.criteria.map(k=>({k:k.id,label:k.name||t('noName'),checked:k.id===ui.view})),{k:ALL,label:t('overallView'),hint:t('overallViewHint'),checked:ui.view===ALL}],
    pick:k=>{ ui.view=k; renderToolbar(); renderMatrix(); renderSide(); renderVarList(); }},
  exportMenu:{items:()=>tr([['pdf','print','exportPdfHint'],['xlsx','exportXlsx','exportXlsxHint'],['csv','exportCsv','exportCsvHint']]), pick:k=>exportAs(k)},
  sortMenu:{items:()=>tr([...(ui.view===OFF?[]:[['rating','sortRating','sortRatingHint']]),['score','sortScore','sortScoreHint'],['alpha','sortAlpha',''],['variants','sortVar','sortVarHint']]), pick:k=>sortCells(k)},
  varSortMenu:{items:()=>[{k:'score',label:t('vSortScore'),hint:t('vSortScoreHint')},...(ui.view===ALL||ui.view===OFF?[]:[{k:'rating',label:t('vSortRating',critName(ui.view)),hint:t('vSortRatingHint')}]),{k:'alpha',label:t('sortAlpha'),hint:''}],
    pick:k=>sortVariants(k)}
};
function closeMenus(){ $$('.menu-list').forEach(l=>l.hidden=true); }
function openMenu(id){
  const root=$('#'+id), list=root.querySelector('.menu-list');
  const items=MENUS[id].items(), check=items.some(it=>'checked' in it);
  list.innerHTML=items.map(it=>`<button type="button" role="menuitem" data-k="${esc(it.k)}"${check?' class="chk"':''}>${check?`<span class="tick">${it.checked?'✓':''}</span>`:''}${esc(it.label)}${it.hint?`<small>${esc(it.hint)}</small>`:''}</button>`).join('');
  list.classList.remove('right'); list.hidden=false;
  if(list.getBoundingClientRect().right>innerWidth-8) list.classList.add('right'); // nicht über den Rand
  (list.querySelector('.chk .tick:not(:empty)')?.parentElement||list.querySelector('button')).focus();
}
function setupMenu(root){
  root.querySelector('.btn').onclick=e=>{ e.stopPropagation(); const open=!root.querySelector('.menu-list').hidden; closeMenus(); if(!open) openMenu(root.id); };
  root.querySelector('.menu-list').onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; closeMenus(); MENUS[root.id].pick(b.dataset.k); };
  root.addEventListener('keydown',e=>{ // Pfeiltasten im offenen Menü, Esc schliesst
    const list=root.querySelector('.menu-list'); if(list.hidden) return;
    const items=[...list.querySelectorAll('button')], i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); e.stopPropagation(); items[(i+1)%items.length].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); e.stopPropagation(); items[(i-1+items.length)%items.length].focus(); }
    else if(e.key==='Escape'){ e.stopPropagation(); closeMenus(); root.querySelector('.btn').focus(); }
    else if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Tab') e.stopPropagation();
  });
}
$$('.menu').forEach(setupMenu);
document.addEventListener('click',e=>{ if(!e.target.closest('.menu')) closeMenus(); });

$('#bar2').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='addVar') return addVariant();
  if(b.classList.contains('vis')){ const v=getVar(b.dataset.var); change(()=>{v.visible=!v.visible;}); }
  if(b.classList.contains('vedit')) toggleEditVar(b.dataset.var);
});
$('#banner').addEventListener('click',e=>{ if(e.target.id==='doneVar'){ ui.editVar=null; renderAll(); } });
$('#openFile').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f){ ui.handle=null; loadData(await f.text()); } };
$('#varImgFile').onchange=e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length&&ui.pickVar) addVarImages(ui.pickVar,fs); };
document.addEventListener('click',e=>{ const z=e.target.closest('[data-zoom]'); if(z) openLightbox(z.dataset.zoom); });
$('#lightbox').onclick=()=>{ $('#lightbox').hidden=true; };
$('#imgFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f&&ui.sel) setCellImage(ui.sel,f); };

/* ---------- Events: Matrix ---------- */
$('#stage').addEventListener('click',e=>{
  const tg=e.target;
  const del=tg.closest('.delrow');
  if(del){
    const row=P.rows.find(r=>r.id===del.dataset.row);
    if(row.cells.length&&!confirm(t('confirmDelRow',row.name,row.cells.length))) return;
    change(()=>{ P.rows=P.rows.filter(r=>r!==row); P.variants.forEach(v=>delete v.picks[row.id]); });
    return;
  }
  const add=tg.closest('.addcell');
  if(add){
    const row=P.rows.find(r=>r.id===add.dataset.row), c=newCell(t('newSolution'));
    ui.editVar=null; change(()=>row.cells.push(c)); select(c.id);
    const i=$('#side [data-edit=title]'); if(i){ i.focus(); i.select(); }
    return;
  }
  if(tg.closest('#addrow')){
    const r={id:uid(),name:t('newSubfn'),cells:[]};
    change(()=>P.rows.push(r));
    const inp=$(`.rowname[data-row="${r.id}"]`); if(inp){ inp.focus(); inp.select(); }
    return;
  }
  const go=tg.closest('[data-goto]');
  if(go){ ui.editVar=null; renderAll(); select(go.dataset.goto); return; }
  const skd=tg.closest('td.sk'); if(skd&&!tg.closest('[data-zoom]')){ setPasteVar(skd.dataset.var); toast(t('pasteSketch')); return; }
  if(tg.closest('[data-addvar]')){ addVariant(); return; }
  if(tg.closest('#varlist')) return;
  const cellEl=tg.closest('.cell');
  if(cellEl){
    const id=cellEl.dataset.cell, rowId=cellEl.dataset.row;
    if(ui.editVar){ const v=getVar(ui.editVar); change(()=>{ if(v.picks[rowId]===id) delete v.picks[rowId]; else v.picks[rowId]=id; }); }
    else select(id);
    return;
  }
  if(tg.closest('.rowhead')) return;
  if(ui.sel) select(null);
});

/* ---------- Events: Sidebar ---------- */
$('#side').addEventListener('click',e=>{
  const card=e.target.closest('.vcard'); if(card&&ui.pasteVar!==card.dataset.pv) setPasteVar(card.dataset.pv);
  const b=e.target.closest('[data-act]'); if(!b||b.type==='checkbox') return;
  const f=ui.sel&&findCell(ui.sel), id=b.dataset.var||b.dataset.crit;
  switch(b.dataset.act){
    case 'back': select(null); break;
    case 'pickimg': $('#imgFile').click(); break;
    case 'rmimg': change(()=>{f.cell.img=null;}); break;
    case 'rate': change(()=>setRating(f.cell,b.dataset.crit,b.dataset.lvl)); break;
    case 'delcell': if(confirm(t('confirmDelCell',f.cell.title))) change(()=>{ removeCell(f.cell.id); ui.sel=null; }); break;
    case 'addcrit': {
      const k={id:uid(),name:t('newCrit')}; change(()=>P.criteria.push(k));
      const i=$(`#side [data-edit=critname][data-crit="${k.id}"]`); if(i){ i.focus(); i.select(); }
      break; }
    case 'delcrit':
      if(P.criteria.length<=1){ toast(t('minCrit')); break; }
      if(confirm(t('confirmDelCrit',critName(id))))
        change(()=>{ P.criteria=P.criteria.filter(k=>k.id!==id); P.rows.forEach(r=>r.cells.forEach(c=>delete c.ratings[id])); });
      break;
    case 'viewcrit': ui.view=id; renderAll(); break;
    case 'addvar': addVariant(); break;
    case 'delvar': if(confirm(t('confirmDelVar',getVar(id).name))) change(()=>{ P.variants=P.variants.filter(v=>v.id!==id); }); break;
    case 'editvar': toggleEditVar(id); break;
    case 'loadsample': loadSample(); break;
    case 'help': openHelp(); break;
    case 'pickvimg': ui.pickVar=id; $('#varImgFile').click(); break;
    case 'rmvimg': if(confirm(t('confirmRmSketch'))){ const v=getVar(id); change(()=>{ v.imgs=v.imgs.filter(x=>x!==b.dataset.img); }); } break;
  }
});
$('#side').addEventListener('change',e=>{
  const tg=e.target; if(tg.type!=='checkbox') return;
  const v=getVar(tg.dataset.var); if(!v) return;
  if(tg.dataset.act==='pick'){ const f=findCell(ui.sel); change(()=>{ if(tg.checked) v.picks[f.row.id]=f.cell.id; else delete v.picks[f.row.id]; }); }
  if(tg.dataset.act==='varvis') change(()=>{ v.visible=tg.checked; });
});

/* ---------- Texteingaben (mit Undo pro Bearbeitung) ---------- */
document.addEventListener('focusin',e=>{ if(e.target.matches('input,textarea')) editSnap=snapshot(); });
document.addEventListener('input',e=>{
  const tg=e.target;
  const dirty=()=>{ ui.dirty=true; updateStatus(); scheduleSave(); if(!['size','lineop','ptitle'].includes(tg.id)) renderVarList(); };
  if(tg.id==='size'){ P.settings.cellW=+tg.value; applySize(); drawLines(); return dirty(); }
  if(tg.id==='lineop'){ P.settings.lineOp=Math.round((1-tg.value)*100)/100; drawLines(); return dirty(); }
  if(tg.id==='ptitle'){ beginEdit(); P.title=tg.value; return dirty(); }
  if(tg.classList.contains('rowname')){ beginEdit(); P.rows.find(r=>r.id===tg.dataset.row).name=tg.value; return dirty(); }
  const k=tg.dataset.edit; if(!k) return;
  beginEdit();
  const f=ui.sel&&findCell(ui.sel), v=tg.dataset.var&&getVar(tg.dataset.var), crit=tg.dataset.crit;
  switch(k){
    case 'title': f.cell.title=tg.value; rerenderCell(f.cell.id); break;
    case 'desc': f.cell.desc=tg.value; rerenderCell(f.cell.id); drawLines(); break;
    case 'reason': ensureRating(f.cell,crit).reason=tg.value; rerenderCell(f.cell.id); break;
    case 'critname': P.criteria.find(c=>c.id===crit).name=tg.value; renderToolbar(); renderMatrix(); break;
    case 'varname': v.name=tg.value; renderToolbar(); renderBanner(); break;
    case 'varnote': v.note=tg.value; break;
    case 'varcolor': v.color=tg.value; tg.closest('.vcard').style.setProperty('--c',v.color); renderToolbar(); drawLines(); break;
  }
  dirty();
});

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey, key=e.key.toLowerCase();
  if(mod&&key==='s'){ e.preventDefault(); saveFile(e.shiftKey); return; }
  if(mod&&key==='o'){ e.preventDefault(); openFile(); return; }
  if($('#helpDlg').open||$('#mobileDlg').open) return; // Dialog offen: Tastenkürzel nicht an den Kasten weitergeben
  if(e.target.matches?.('input,textarea,select')){ if(e.key==='Escape') e.target.blur(); return; }
  if(mod&&key==='z'&&!e.shiftKey){ e.preventDefault(); undo(); return; }
  if(mod&&(key==='y'||(key==='z'&&e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(mod||e.altKey) return;
  if(e.key==='Escape'&&!$('#lightbox').hidden){ $('#lightbox').hidden=true; return; }
  if(e.key==='Escape'){ if(ui.editVar){ ui.editVar=null; renderAll(); } else if(ui.sel) select(null); return; }
  if(e.key==='?'||e.key==='F1'){ e.preventDefault(); openHelp(); return; }
  if(key==='s'){ setSide(!sideVisible()); return; }
  if(key==='k'){ toggleCoords(!P.settings.coords); ui.dirty=true; updateStatus(); scheduleSave(); return; }
  if(key==='d'){ toggleDesc(); return; }
  if(key==='b'){ toggleRating(); return; }
  if(ui.sel&&['1','2','3','0'].includes(e.key)){
    if(ui.view===OFF){ toast(t('keysOff')); return; }
    if(ui.view===ALL){ toast(t('keysAll')); return; }
    const f=findCell(ui.sel); change(()=>setRating(f.cell,ui.view,{1:'g',2:'y',3:'r',0:''}[e.key])); return;
  }
  if(ui.sel&&e.key.startsWith('Arrow')){ e.preventDefault(); moveSel(e.key); }
});

/* ---------- Einfügen aus Zwischenablage ---------- */
document.addEventListener('paste',e=>{
  const item=[...(e.clipboardData?.items||[])].find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  if(!item) return;
  e.preventDefault();
  if(ui.sel) return setCellImage(ui.sel,item.getAsFile());
  if(ui.pasteVar&&getVar(ui.pasteVar)) return addVarImages(ui.pasteVar,[item.getAsFile()]);
  toast(t('pasteWhere'));
});

/* ---------- Drag & Drop ---------- */
let drag=null;
const MARKS=['mark-left','mark-right','mark-file','mark-end','mark-top','mark-bottom'];
function clearMarks(){ $$('.'+MARKS.join(',.')).forEach(el=>el.classList.remove(...MARKS)); }
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('.handle');
  if(h){ const row=h.closest('.row'); drag={type:'row',id:row.dataset.row};
    e.dataTransfer.setData('text/plain','row'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setDragImage(row,20,20); return; }
  const vg=e.target.closest&&e.target.closest('.vgrip');
  if(vg){ const vh=vg.closest('th[data-vh]'); drag={type:'var',id:vh.dataset.vh}; e.dataTransfer.setData('text/plain','variant'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setDragImage(vh,20,20); vh.classList.add('dragging'); return; }
  const cg=e.target.closest&&e.target.closest('.cgrip'), c=cg&&cg.closest('.cell');
  if(c){ e.dataTransfer.setDragImage(c,20,20); drag={type:'cell',id:c.dataset.cell}; e.dataTransfer.setData('text/plain','cell'); e.dataTransfer.effectAllowed='move'; c.classList.add('dragging'); }
});
document.addEventListener('dragend',()=>{ drag=null; clearMarks(); $$('.dragging').forEach(el=>el.classList.remove('dragging')); });
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) clearMarks(); });
document.addEventListener('dragover',e=>{
  const files=!drag&&hasFiles(e);
  if(!drag&&!files) return;
  e.preventDefault(); clearMarks();
  const tg=e.target.closest?e.target:e.target.parentElement;
  if(drag&&drag.type==='var'){
    const th=tg.closest('th[data-vh]');
    if(th){ const r=th.getBoundingClientRect(); th.classList.add(e.clientX<r.left+r.width/2?'mark-left':'mark-right'); e.dataTransfer.dropEffect='move'; }
    else e.dataTransfer.dropEffect='none';
    return;
  }
  if(drag&&drag.type==='row'){
    const row=tg.closest('.row[data-row]');
    if(row){ const r=row.getBoundingClientRect(); row.classList.add(e.clientY<r.top+r.height/2?'mark-top':'mark-bottom'); e.dataTransfer.dropEffect='move'; }
    else e.dataTransfer.dropEffect='none';
    return;
  }
  const cell=tg.closest('.cell');
  if(cell){
    if(files){ cell.classList.add('mark-file'); e.dataTransfer.dropEffect='copy'; }
    else{ const r=cell.getBoundingClientRect(); cell.classList.add(e.clientX<r.left+r.width/2?'mark-left':'mark-right'); e.dataTransfer.dropEffect='move'; }
    return;
  }
  const cells=tg.closest('.cells[data-row]');
  if(cells){ cells.classList.add('mark-end'); e.dataTransfer.dropEffect=files?'copy':'move'; return; }
  const vd=tg.closest('.vdrop');
  if(vd&&files){ vd.classList.add('mark-file'); e.dataTransfer.dropEffect='copy'; return; }
  const imgdrop=tg.closest('#imgdrop');
  if(imgdrop&&files){ imgdrop.classList.add('mark-file'); e.dataTransfer.dropEffect='copy'; return; }
  e.dataTransfer.dropEffect=files?'copy':'none'; // Dateien überall annehmen (JSON öffnen / Hinweis)
});
document.addEventListener('drop',async e=>{
  if(!drag&&!hasFiles(e)) return;
  e.preventDefault(); clearMarks();
  const tg=e.target.closest?e.target:e.target.parentElement;
  if(drag){
    const d=drag; drag=null;
    if(d.type==='var'){
      const th=tg.closest('th[data-vh]'); if(!th) return;
      const r=th.getBoundingClientRect(); moveVariant(d.id,th.dataset.vh,e.clientX>=r.left+r.width/2); return;
    }
    if(d.type==='row'){
      const row=tg.closest('.row[data-row]'); if(!row) return;
      const r=row.getBoundingClientRect(); moveRow(d.id,row.dataset.row,e.clientY>=r.top+r.height/2);
    }else{
      const cell=tg.closest('.cell');
      if(cell){ const r=cell.getBoundingClientRect(); moveCell(d.id,cell.dataset.row,cell.dataset.cell,e.clientX>=r.left+r.width/2); return; }
      const cells=tg.closest('.cells'); if(cells) moveCell(d.id,cells.dataset.row,null);
    }
    return;
  }
  const all=[...e.dataTransfer.files];
  const imgs=all.filter(f=>f.type.startsWith('image/'));
  const json=all.find(f=>/\.json$/i.test(f.name));
  if(!imgs.length){
    if(json&&confirmDiscard()){ ui.handle=null; loadData(await json.text()); }
    else if(!json) toast(t('onlyImages'));
    return;
  }
  const vd=tg.closest('.vdrop');
  if(vd){ addVarImages(vd.dataset.var,imgs); return; }
  const cell=tg.closest('.cell');
  if(cell){ setCellImage(cell.dataset.cell,imgs[0]); if(imgs.length>1) toast(t('firstImgOnly')); return; }
  if(tg.closest('#imgdrop')&&ui.sel){ setCellImage(ui.sel,imgs[0]); return; }
  const cells=tg.closest('.cells');
  if(cells){ addCellsFromFiles(cells.dataset.row,imgs); return; }
  toast(t('dropWhere'));
});

/* ---------- Druck ---------- */
// Druck: Seite 1 = Titel + Kasten (auf A4 quer eingepasst), Seite 2 = Variantenübersicht
const PRINT_W=1060, PRINT_H=730; // nutzbare Fläche A4 quer bei 8 mm Rand, in CSS-px
function preparePrint(){
  const mx=$('#matrix'), vl=$('#varlist'), svg=$('#lines');
  mx.style.zoom=''; vl.style.zoom=''; svg.style.transform=''; $('#stage').scrollLeft=0;
  ui.printing=true; renderPrintHead(); drawLines();
  const headH=70+Math.ceil(P.variants.filter(v=>v.visible).length/4)*18;
  // tatsächliche Inhaltsgrösse (ohne «+»-Knöpfe, die im Druck fehlen)
  const mr=mx.getBoundingClientRect(); let cw=1,ch=1;
  $$('#matrix .rowhead, #matrix .cell').forEach(el=>{ const r=el.getBoundingClientRect(); cw=Math.max(cw,r.right-mr.left); ch=Math.max(ch,r.bottom-mr.top); });
  const z=Math.min(1.4,PRINT_W/cw,(PRINT_H-headH)/ch); // kleine Kästen dürfen etwas grösser werden
  if(z!==1){ mx.style.zoom=z; svg.style.transformOrigin='0 0'; svg.style.transform=`scale(${z})`; }
  const tbl=vl.querySelector('.vt'); const zv=tbl?Math.min(1,PRINT_W/tbl.offsetWidth):1;
  if(zv<1) vl.style.zoom=zv;
}
function endPrint(){
  ui.printing=false; $('#matrix').style.zoom=''; $('#varlist').style.zoom=''; $('#lines').style.transform=''; drawLines();
}
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('afterprint',endPrint);
window.addEventListener('resize',()=>{ applySize(); drawLines(); });
window.addEventListener('beforeunload',e=>{ if(ui.dirty&&!ui.autosaveOk){ e.preventDefault(); e.returnValue=''; } });

/* ---------- Start ---------- */
(async()=>{
  const saved=await Promise.race([idbGet('current'),new Promise(r=>setTimeout(()=>r(null),2000))]);
  let restored=false;
  if(saved&&saved.data){
    try{
      const m=migrate(JSON.parse(saved.data));
      if(m.newer){ // Zwischenspeicher einer neueren Version: sichern statt überschreiben
        await idbSet('backup-newer-v'+m.newer,saved).catch(()=>{}); toast(t('cacheTooNew'));
      }else{ P=normalize(m.data.project); IMG=m.data.images||{}; ui.dirty=!!saved.dirty||m.from<SCHEMA_VERSION; restored=true; }
    }catch(e){ console.warn(e); }
  }
  if(!restored){ P=sampleProject(); IMG={}; ui.sample=true; }
  validateUi(); renderAll();
  { let v='1'; try{ v=localStorage.getItem('mk-side')??'1'; }catch(e){} setSide(v!=='0'); }
  if(restored) toast(t('restored'));
  if(isPhone()){ let seen=null; try{ seen=sessionStorage.getItem('mk-mobile-seen'); }catch(e){} if(!seen) $('#mobileDlg').showModal(); }
  else { let seen=null; try{ seen=localStorage.getItem('mk-help-seen'); }catch(e){ seen='1'; } if(!seen&&!restored) openHelp(); }
  if(document.fonts) document.fonts.ready.then(drawLines);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.add('ready')));
})();
</script>
